# Web de Sin Humo: sirve la aplicación y reenvía la API por el MISMO origen
# (la sesión es una cookie y el servidor rechaza pedidos de otro origen).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Seguridad: sin incrustar la web en otros sitios, sin adivinar tipos, y sólo scripts propios
  # (más los del captcha: Cloudflare Turnstile o hCaptcha).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://js.hcaptcha.com https://*.hcaptcha.com; frame-src https://challenges.cloudflare.com https://*.hcaptcha.com; connect-src 'self' https://*.hcaptcha.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Revisar una foto o un video: el único pedido con archivo grande (hasta 20 MB).
  location = /v1/media/check {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
  }

  # API, acceso, rutas públicas, audios y salud → backend.
  location ~ ^/(v1|auth|public|media|health|webhooks|mcp)(/|$) {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Tiempo real (SSE): sin buffer y conexiones largas.
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 2m;
  }

# Ojo: en nginx, si un `location` usa add_header, pierde TODOS los del server (incluida la CSP).
  # Por eso el caché se maneja con `expires`, que no los pisa.

  # Archivos con hash en el nombre: se guardan un año.
  location /assets/ {
    expires 1y;
  }

  # Aplicación de una sola página: cualquier otra ruta la resuelve el navegador (y siempre se revalida).
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
